services:
  nginx:
    image: nginx:1.27-alpine
    container_name: safeschool-nginx
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - safeschool

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: safeschool-app
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - mysql
      - redis
    networks:
      - safeschool

  mysql:
    image: mysql:8.4
    container_name: safeschool-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: safeschool
      MYSQL_USER: safeschool
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - safeschool

  redis:
    image: redis:7.4-alpine
    container_name: safeschool-redis
    ports:
      - "6379:6379"
    networks:
      - safeschool

  mailpit:
    image: axllent/mailpit:latest
    container_name: safeschool-mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - safeschool

volumes:
  mysql-data:

networks:
  safeschool:
    driver: bridge